<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module">
import { Renderer, GROUP_COLORS } from '/js/render.js';
import { LEVELS } from '/shared/levels.js';
import { buildLevel, createState, step, TS } from '/shared/sim.js';
const q = new URLSearchParams(location.search);
const n = +q.get('level'), k = q.has('state') ? +q.get('state') : -1;
const LABELS = {
  14: [[8, 27.3, 'E1', 0], [26.5, 26.3, 'P1', 0], [36.5, 27.3, 'S1', 1], [25.5, 13.3, 'L1', 1], [16.5, 19.0, 'P2', 2],
       [21.5, 5.3, 'G2', 2], [15, 10.9, 'bridge', 2], [3.5, 7.3, 'L2', 2], [26.9, 15.0, 'T1', -1], [32.5, 13.0, 'T2', -1], [26.9, 11.0, 'T3', -1]],
  19: [[5, 27.3, 'E0', 0], [25.5, 26.3, 'P0', 0], [28.5, 26.3, 'P1', 1], [7.5, 16.3, 'P0b', 0], [18.5, 13.3, 'G1', 1],
       [25, 17.0, 'P2', 1], [31.5, 13.3, 'G2', 1], [11, 12.9, 'ledge', -1]],
  26: [[11.5, 7.3, 'B', 1], [17.5, 7.3, 'A', 0], [21.5, 5.3, 'GW', 2], [33.5, 7.3, 'LR', 3], [27.5, 13.3, 'PF', 2],
       [32, 21.0, 'E', 1], [34.5, 11.8, 'GX', 3], [12, 23.6, 'bridge 1', 0], [23.5, 23.6, 'bridge 2', 0], [17.5, 24.8, 'refuge', -1]],
};
const L = buildLevel(LEVELS[n - 1], n - 1);
if (q.has('grid')) {
  const all = await (await fetch('/_cap/states.json')).json();
  const out = document.getElementById('c'); out.width = 960; out.height = 720;
  const o = out.getContext('2d');
  all[n].forEach((st, i) => {
    const c = document.createElement('canvas'); const r = new Renderer(c);
    r.resize(960, 720); r.setLevel(L); r.draw(L, st.S, null, 1.0);
    const X = (i % 2) * 480, Y = Math.floor(i / 2) * 360;
    o.drawImage(c, X, Y, 480, 360);
    o.font = 'bold 15px system-ui, sans-serif'; o.textBaseline = 'middle';
    const t = `${i + 1}. ${st.name}`, w = o.measureText(t).width + 16;
    o.fillStyle = 'rgba(12,8,24,0.85)'; o.fillRect(X + 6, Y + 6, w, 24);
    o.fillStyle = '#fff'; o.fillText(t, X + 14, Y + 18);
  });
  o.fillStyle = '#000'; o.fillRect(479, 0, 2, 720); o.fillRect(0, 359, 960, 2);
  document.title = 'ready';
  throw 0;
}
let S;
if (k >= 0) { const all = await (await fetch('/_cap/states.json')).json(); S = all[n][k].S; }
else { S = createState(L); for (let i = 0; i < 10; i++) step(L, S, [0, 0]); }
const cv = document.getElementById('c');
const R = new Renderer(cv);
R.resize(960, 720); R.setLevel(L);
R.draw(L, S, null, 1.0);
if (q.has('labels')) {
  const g = cv.getContext('2d');
  g.setTransform(R.scale, 0, 0, R.scale, 0, 0);
  g.font = 'bold 13px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  for (const [x, y, t, grp] of LABELS[n] || []) {
    const w = g.measureText(t).width + 12, X = x * TS, Y = y * TS;
    g.fillStyle = 'rgba(12,8,24,0.82)'; g.beginPath(); g.roundRect(X - w / 2, Y - 10, w, 20, 6); g.fill();
    g.strokeStyle = grp >= 0 ? GROUP_COLORS[grp] : '#c9c2dd'; g.lineWidth = 2; g.stroke();
    g.fillStyle = '#fff'; g.fillText(t, X, Y + 0.5);
  }
}
document.title = 'ready';
</script>
